# Neovide reads this before Neovim starts, so keep a known-good font here
# instead of relying on Neovide's platform default fallback list.
[font]
normal = ["VictorMono Nerd Font Mono"]
bold = ["VictorMono Nerd Font Mono"]
italic = ["VictorMono Nerd Font Mono"]
bold_italic = ["VictorMono Nerd Font Mono"]
size = 19.0
